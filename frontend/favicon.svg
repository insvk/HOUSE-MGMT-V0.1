<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#405189" />
      <stop offset="50%" stop-color="#299cdb" />
      <stop offset="100%" stop-color="#0ab39c" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#212529" stroke="url(#brandGrad)" stroke-width="2.5" />
  
  <!-- Modern Geometric Building Icon -->
  <g filter="url(#dropShadow)">
    <!-- Main Tower -->
    <rect x="22" y="14" width="20" height="38" rx="2" fill="url(#brandGrad)" />
    
    <!-- Left Wing -->
    <path d="M12 26 H20 V52 H12 Z" fill="#299cdb" opacity="0.85" />
    
    <!-- Right Wing -->
    <path d="M44 32 H52 V52 H44 Z" fill="#0ab39c" opacity="0.85" />
    
    <!-- Windows Grid in Main Tower -->
    <circle cx="27" cy="21" r="1.6" fill="#ffffff" opacity="0.9" />
    <circle cx="37" cy="21" r="1.6" fill="#ffffff" opacity="0.9" />
    <circle cx="27" cy="28" r="1.6" fill="#ffffff" opacity="0.9" />
    <circle cx="37" cy="28" r="1.6" fill="#ffffff" opacity="0.9" />
    <circle cx="27" cy="35" r="1.6" fill="#ffffff" opacity="0.9" />
    <circle cx="37" cy="35" r="1.6" fill="#ffffff" opacity="0.9" />
    <circle cx="27" cy="42" r="1.6" fill="#ffffff" opacity="0.9" />
    <circle cx="37" cy="42" r="1.6" fill="#ffffff" opacity="0.9" />
    
    <!-- Golden Accent Pillar Dot -->
    <circle cx="32" cy="48" r="2" fill="#f7b84b" />
  </g>
</svg>
